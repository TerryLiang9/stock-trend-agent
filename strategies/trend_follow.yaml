# QMT Trend Following Strategy / QMT 趋势跟踪策略

name: trend_follow_qmt
display_name: QMT趋势跟踪
description: 通过比较相邻尖点或谷点识别趋势反转后的延续，开仓后锁定结构止损并在止损后等待新的相邻结构。
category: trend
core_rules: [1, 2, 3, 5, 6]
required_tools:
  - get_realtime_quote
  - get_daily_history
  - analyze_trend
aliases: [趋势跟踪, 尖谷趋势, QMT趋势跟踪]
default_active: false
default_router: false
default_priority: 70
user_invocable: false
market_regimes: [trending_up, trending_down]

instructions: |
  **QMT趋势跟踪策略（Trend Following）**

  该策略对应项目中的 `xtlt_strategy_trend_long.py` 和 `xtlt_strategy_trend_short.py`。
  核心状态是相邻有效尖点/谷点的比较，不在持仓或开仓父订单执行期间追踪新的开仓结构。

  ## 入场逻辑

  1. **做多趋势信号**
     - 第一个有效谷点只初始化 `last_valley_price`，不立即开仓。
     - 后续谷点低于或等于 `last_valley_price` 时，更新 `last_valley_price`，继续等待。
     - 后续谷点高于 `last_valley_price` 时，确认谷点抬高，开一笔做多仓。
     - 本次开多的止损价就是当前谷点价格，并按配置的多头止损滑点向下调整。
     - 开仓成功后将当前谷点保存为新的 `last_valley_price`；持仓或开仓父订单未完成时，不再更新它，也不再开新仓。

  2. **做空趋势信号**
     - 第一个有效尖点只初始化 `last_peak_price`，不立即开仓。
     - 后续尖点高于或等于 `last_peak_price` 时，更新 `last_peak_price`，继续等待。
     - 后续尖点低于 `last_peak_price` 时，确认尖点降低，开一笔做空仓。
     - 本次开空的止损价就是当前尖点价格，并按配置的空头止损滑点向上调整。
     - 开仓成功后将当前尖点保存为新的 `last_peak_price`；持仓或开仓父订单未完成时，不再更新它，也不再开新仓。

  3. **止损后的结构重建**
     - 开仓后如果没有止损，后续尖点/谷点不能继续推进对应的 `last_peak_price` 或 `last_valley_price`。
     - 如果发生止损，下一次有效尖点/谷点重新参与相邻比较。
     - 止损后的新尖点/谷点必须先满足结构顺序，再等待下一个点形成新的开仓条件，不能直接沿用旧开仓点重复开仓。

  4. **方向限制**
     - 单边趋势脚本只执行自身方向。
     - 双边模式必须分别保存多头和空头的结构状态、仓位推进状态、止损状态与二次入场状态，两个方向互不影响。

  ## 止损与二次入场

  - 止损触发时，先撤销仍在拆单的开仓父订单剩余未成交数量，再按实际成交持仓执行平仓。
  - 止损平仓完成后，价格重新回到原开仓价才允许同方向二次入场。
  - `double` 和 `initial_increment` 模式使用原有动态仓位推进及二次入场逻辑。
  - `sequence` 模式的二次入场数量从 `STOP_REENTRY_QTY_SEQUENCE` 顺序读取，列表耗尽后不再二次入场。
  - 二次入场成功后，下一次止损仍可重新生成新的二次入场机会，直到序列耗尽。

  ## 订单与尾盘边界

  - 开仓、止损平仓和尾盘强平都复用父订单拆单机制；数量推进以实际成交数量为准。
  - 父订单发送异常必须阻止该父订单继续作为活跃订单推进，并保留可对账的错误状态。
  - `14:55` 后禁止新的趋势开仓，撤销仍在拆单的开仓父订单及未成交剩余部分。
  - `14:57` 执行尾盘强平，不能在强平期间提交任何剩余开仓子单。
  - 所有数量还要经过最小委托数量、方向可用股数、账户资金/可卖数量和当日开仓额度检查。

  ## 输出要求

  - 明确说明当前点是初始化、结构更新、趋势开仓、持仓锁定还是止损后等待。
  - 开仓信号必须同时输出前一尖点/谷点、当前尖点/谷点、方向、开仓价和止损价。
  - 对已有持仓、开仓父订单执行中、序列耗尽、额度不足和尾盘禁止开仓给出明确原因。

  评分调整建议：
  - 做多谷点抬高并得到趋势确认：`sentiment_score +12`
  - 做空尖点降低并得到趋势确认：`sentiment_score -12`
  - 结构仍在初始化或持续创新低/新高：`sentiment_score 0，等待确认`
  - 跌破当前结构止损或尾盘进入强平窗口：`sentiment_score -15`
