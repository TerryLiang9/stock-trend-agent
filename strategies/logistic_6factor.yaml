instructions: |
  **逻辑回归6因子模型（Logistic 6-Factor Model）**

  适用场景：
  - 需要定量化方向判断时使用。
  - 替代纯主观判断，提供可重复的概率输出。
  - 适用于日内盘中修正和日终盘后分析。

  核心公式：
  ```
  P(跌) = clip(0.5 − 0.25 × Σ(wᵢ × sᵢ), 0.20, 0.80)
  P(涨) = 1 − P(跌)
  ```

  六因子明细：

  | # | 因子 | 权重 | 计算逻辑 |
  |---|------|------|----------|
  | 1 | 个股趋势 | 35% | 收盘价 vs MA5/MA10/MA20 的加权偏离 (5:3:2) |
  | 2 | 文献反转 | 20% | 基于今日 OHLC 的形态规则（高开低走、低开修复等） |
  | 3 | 国内板块 | 20% | 科创50 + 半导体ETF 中位数涨跌幅 |
  | 4 | 韩国半导体 | 15% | 三星 + SK海力士 均值涨跌幅 |
  | 5 | 美股与日本 | 5% | NASDAQ + NIKKEI 均值涨跌幅 |
  | 6 | 政策传导 | 5% | policy_state.json 政策信号值 |

  决策规则：
  - 概率 > 58% 才判定方向（涨/跌），否则为震荡
  - 置信度 = |P − 0.5| × 2
  - 覆盖权重 = 实际参与计算的因子权重之和

  日内修正（盘中模式）：
  - 根据 (最新价/开盘价 − 1) 修正基础概率
  - < 0.5% → 不修正
  - 1%~2% → ±0.02 pp
  - > 2% → ±0.04 pp（上限）
  - 高开低走 / 低开修复叠加额外 0.02 pp 修正

  三策略得分（0-100）：

  | 策略 | 计算方式 |
  |------|----------|
  | 多空都做 | 多空得分加权 + 15 分流动性溢价 |
  | 只做多 | P(涨)×70 + 覆盖权重×30 |
  | 只做空 | P(跌)×70 + 覆盖权重×30 − 12 分融资成本惩罚 |

  分析步骤：

  1. **调用工具**：使用 `logistic_6factor` 工具获取完整因子分解和概率输出。

  2. **解读方向**：
     - 方向明确（>58%）时，结合置信度评估可信度。
     - 震荡判断时，说明多空力量均衡，不宜强行选方向。

  3. **策略匹配**：
     - 根据三策略得分，推荐最适合当前市况的策略类型。
     - 只做多得分高 + 方向=涨 → 建议做多。
     - 只做空得分高 + 方向=跌 → 建议做空/减仓。
     - 多空都做得分高 → 说明市场方向不明，适合观望或对冲。

  4. **覆盖权重关注**：
     - 覆盖权重 < 80% 时，说明关键因子缺失，需谨慎对待结果。
     - 明确告知用户哪些因子缺失及原因。

  5. **结合其他策略**：
     - 6因子模型提供定量锚点，可与其他定性策略（如龙头、缩量回踩）交叉验证。
     - 当定量结果与定性判断冲突时，优先尊重定量模型（避免情绪偏差）。

  评分调整建议：
  - 方向明确 + 置信度 > 30%：sentiment_score +10
  - 方向明确 + 置信度 > 50%：sentiment_score +15
  - 覆盖权重 < 60%（数据不足）：sentiment_score -8
  - 方向=震荡：不加减分（中性）
