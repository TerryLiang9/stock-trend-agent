# QMT Mean Reversion Strategy / QMT 均值回归策略

name: mean_reversion_qmt
display_name: QMT均值回归
description: 基于相邻尖点和谷点的反向波动入场，止损后允许按配置进行二次入场，适用于日内均值回归交易。
category: reversal
core_rules: [1, 3, 4, 5, 6]
required_tools:
  - get_realtime_quote
  - get_daily_history
  - analyze_trend
aliases: [均值回归, 尖谷反转, QMT均值回归]
default_active: false
default_router: false
default_priority: 60
user_invocable: false
market_regimes: [sideways, volatile]

instructions: |
  **QMT均值回归策略（Mean Reversion）**

  该策略对应项目中的 `xtlt_strategy_long.py`、`xtlt_strategy_short.py`，以及双边版本中的均值回归分支。
  信号必须使用已经确认的尖点/谷点，不使用尚未确认的当前波动高低点。

  ## 入场逻辑

  1. **做多信号**
     - 记录最近一次有效谷点价格。
     - 只有当新的有效谷点低于最近谷点时，才认为价格出现向下偏离并生成做多机会。
     - 已有做多持仓，或做多开仓父订单仍在拆单时，不再重复开多，也不更新有效状态。
     - 做多开仓价使用当前可成交买价；止损价使用当前谷点价格，并按配置的止损滑点向下调整：
       `谷点价格 × (1 - STOP_LOSS_SLIPPAGE_PERCENT)`。

  2. **做空信号**
     - 记录最近一次有效尖点价格。
     - 只有当新的有效尖点高于最近尖点时，才认为价格出现向上偏离并生成做空机会。
     - 已有做空持仓，或做空开仓父订单仍在拆单时，不再重复开空，也不更新有效状态。
     - 做空开仓价使用当前可成交卖价；止损价使用当前尖点价格，并按配置的止损滑点向上调整：
       `尖点价格 × (1 + STOP_LOSS_SLIPPAGE_PERCENT)`。

  3. **方向限制**
     - `TRADE_MODE=long_only` 时只执行做多逻辑。
     - `TRADE_MODE=short_only` 时只执行做空逻辑。
     - `TRADE_MODE=both` 时两边状态、仓位额度、动态仓位下标和止损回补序列必须分别维护，互不影响。

  ## 止损与二次入场

  - 多头持仓价格跌至止损价时，先撤销仍在拆单的做多开仓父单及其未成交部分，再根据实际成交仓位执行止损平仓。
  - 空头持仓价格升至止损价时，执行对称处理。
  - 止损平仓完成后，只有价格重新回到该次开仓价，才允许生成同方向二次入场。
  - `double` 和 `initial_increment` 模式沿用原有动态仓位推进逻辑。
  - `sequence` 模式使用 `STOP_REENTRY_QTY_SEQUENCE` 的下一项作为二次入场目标数量；列表耗尽后不再二次入场。
  - 二次入场列表中的数量是目标数量，仍需经过最小委托数量、当日方向股数额度、账户资金/可卖数量和拆单规则检查。
  - 二次入场机会只属于原方向，另一方向的持仓、止损或额度变化不能清除或推进它。

  ## 订单与尾盘边界

  - 所有开仓和平仓都使用父订单拆单机制；每个子单成交后根据实际成交数量推进父订单。
  - 下单异常不能留下可继续推进的活跃父订单；订单状态需要进入阻塞或等待对账状态。
  - `14:55` 后停止新的信号开仓，并撤销正在拆单的开仓父订单剩余未成交部分。
  - `14:57` 执行尾盘强平，剩余持仓按强平逻辑一次性处理；尾盘强平不得重新推进开仓父订单。
  - 如果账户额度不足、可卖数量不足或剩余数量小于最小委托数量，应明确记录跳过原因，不重复下单。

  ## 输出要求

  - 明确输出方向、尖点/谷点价格、入场价格、止损价格和触发原因。
  - 区分“新信号开仓”“止损二次入场”“止损平仓”“尾盘强平”。
  - 对数量不足、父订单已存在、序列耗尽和尾盘禁止开仓给出明确原因。

  评分调整建议：
  - 新谷点低于前一谷点且价格接近回归区域：`sentiment_score +8`
  - 新尖点高于前一尖点且价格接近回归区域：`sentiment_score -8`
  - 价格已经回到均值区域但没有新的尖谷信号：`sentiment_score 0，观望`
  - 止损触发或账户额度不足：`sentiment_score -12`
